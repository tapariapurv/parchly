name: Inkdown
options:
  bundleIdPrefix: com.purvt
  deploymentTarget:
    macOS: "14.0"
packages:
  cmark:
    url: https://github.com/swiftlang/swift-cmark.git
    branch: gfm
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7PM4P8RLL2
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Inkdown:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
      - target: InkdownQuickLook
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.purvt.Inkdown
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Inkdown
        NSHumanReadableCopyright: © 2026 Purv Taparia. MIT License.
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconSystemGenerated: 1
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).Document
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn]
              public.mime-type: [text/markdown]
  InkdownQuickLook:
    type: app-extension
    platform: macOS
    sources: [QuickLook, Shared]
    dependencies:
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
      - sdk: QuickLookUI.framework
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Inkdown Quick Look
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [net.daringfireball.markdown]
