name: Parchly
options:
  bundleIdPrefix: com.purvt
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  cmark:
    url: https://github.com/swiftlang/swift-cmark.git
    branch: gfm
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "52"
    DEVELOPMENT_TEAM: 7PM4P8RLL2
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Parchly:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Resources/**"]
      - Shared
      - path: App/Resources/vendor
        type: folder
        buildPhase: resources
    dependencies:
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
      - package: Sparkle
      - target: ParchlyQuickLook
    entitlements:
      path: App/Parchly.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.print: true
        com.apple.security.temporary-exception.mach-lookup.global-name:   # Sparkle's sandboxed installer
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        com.apple.security.network.client: true   # WKWebView preview processes need it; the app makes no network requests
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.purvt.Parchly
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Parchly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © 2026 Purv Taparia. MIT License.
        ITSAppUsesNonExemptEncryption: false
        SUFeedURL: https://tapariapurv.github.io/parchly/appcast.xml
        SUPublicEDKey: DJtlLIHsKEN7cXhigcGcQjnpWfDtW28rsyTqZlv6//o=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            CFBundleTypeIconSystemGenerated: 1
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).Document
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn]
              public.mime-type: [text/markdown]
  ParchlyQuickLook:
    type: app-extension
    platform: macOS
    sources: [QuickLook, Shared]
    dependencies:
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
      - sdk: QuickLookUI.framework
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Parchly Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [net.daringfireball.markdown]
